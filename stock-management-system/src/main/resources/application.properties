# Common settings for all profiles
spring.application.name=stock-management-system
spring.profiles.active=dev

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway manages the schema, not Hibernate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.web.resources.cache.period=0

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Error pages: stack trace / internal message user ko na dikhe
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Multipart (not used yet, safe defaults)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.stockmanagement=DEBUG
logging.level.org.springframework.security=INFO
# Common settings for all profiles
spring.application.name=stock-management-system
# Profile ab environment se aata hai. Production server par SPRING_PROFILES_ACTIVE=prod set karo.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway manages the schema, not Hibernate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.web.resources.cache.period=0

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# HTTPS par chalate ho to SESSION_COOKIE_SECURE=true (prod profile me default true)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Proxy ke peeche sahi scheme/IP ke liye (sirf jab proxy trusted ho)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Error pages: stack trace / internal message user ko na dikhe
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Multipart (not used yet, safe defaults)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.stockmanagement=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO

# ---- AI data assistant (agent) ----
ai.agent.enabled=true
ai.readonly.datasource.url=${AI_RO_URL:}
ai.readonly.datasource.username=${AI_RO_USER:}
ai.readonly.datasource.password=${AI_RO_PASS:}
ai.agent.max-input-tokens=25000

# ---- API Keys: ChatGPT / Claude / other software se connect (Settings > API Keys) ----
api.external.enabled=${API_EXTERNAL_ENABLED:true}
api.external.require-https=${API_EXTERNAL_REQUIRE_HTTPS:true}
api.external.trust-proxy=${API_EXTERNAL_TRUST_PROXY:false}
api.external.per-key-per-minute=30
api.external.per-ip-per-minute=60
api.external.max-failed-per-ip=10
# nginx/load-balancer ke peeche: kitne trusted proxy hops (nginx akela = 1). X-Forwarded-For right se gina jata hai.
api.external.trusted-proxy-hops=${API_EXTERNAL_TRUSTED_HOPS:1}
# /api/v1 request body ki max size (bytes). Default 256 KB.
api.external.max-body-bytes=262144

# Login lockout + audit log IP ke liye proxy trust (default: api.external.trust-proxy jaisa).
# Nginx ke peeche chalate ho to APP_TRUST_PROXY=true set karo (aur nginx me X-Forwarded-For OVERWRITE/append karo).
app.security.trust-proxy=${APP_TRUST_PROXY:${API_EXTERNAL_TRUST_PROXY:false}}
app.security.trusted-proxy-hops=${API_EXTERNAL_TRUSTED_HOPS:1}

# Trusted IPs (comma separated, exact IPs only), e.g. APP_TRUSTED_IPS=203.0.113.5,198.51.100.7
# - Login: no per-IP lockout for these IPs (username limits still apply, so password guessing is still stopped).
# - API: 10x the normal per-IP request and failed-attempt limits.
# Empty (default) = every IP is treated the same. Only reliable when APP_TRUST_PROXY / hops are set correctly.
app.security.trusted-ips=${APP_TRUSTED_IPS:}
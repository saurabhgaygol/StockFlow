<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Change Password - Stock Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="/css/app.css" rel="stylesheet"/>
    <link href="/css/login.css" rel="stylesheet"/>
</head>
<body class="sms-login-body">

<div class="sms-split">
    <div class="sms-form-panel" style="flex:1;">
        <div class="sms-form-card">
            <div class="sms-form-title">Change password</div>
            <div class="sms-form-subtitle" th:if="${forced}">
                For security, you must set a new password before continuing.
            </div>
            <div class="sms-form-subtitle" th:unless="${forced}">
                Enter your current password and choose a new one.
            </div>

            <div class="sms-alert alert-danger" style="color: red" th:if="${error}">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/change-password}" method="post" autocomplete="off">
                <div class="sms-input-group">
                    <label for="currentPassword">Current password</label>
                    <div class="sms-input-wrap">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="currentPassword" name="currentPassword"
                               placeholder="Enter current password" required autofocus/>
                    </div>
                </div>

                <div class="sms-input-group">
                    <label for="newPassword">New password</label>
                    <div class="sms-input-wrap">
                        <i class="bi bi-key"></i>
                        <input type="password" id="newPassword" name="newPassword"
                               placeholder="Min 8 characters, letters and numbers" minlength="8" required/>
                    </div>
                </div>

                <div class="sms-input-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <div class="sms-input-wrap">
                        <i class="bi bi-key-fill"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               placeholder="Re-enter new password" minlength="8" required/>
                    </div>
                </div>

                <button type="submit" class="sms-btn-login">Update Password</button>
            </form>

            <form th:action="@{/logout}" method="post" style="margin-top:14px; text-align:center;">
                <button type="submit" class="btn btn-link" style="font-size:13px;">Log out</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Console</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
<div class="shell">

    <div th:replace="~{fragments/sidebar :: sidebarShell}"></div>

    <main class="main">
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div class="content" id="page-content">

            <div class="page-head">
                <div>
                    <h2>User</h2>
                    <p>Create a user, open it to set screen access, and add its branches.</p>
                </div>
                <div class="page-actions">
                    <button type="button" class="btn">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3V15M12 15L8 11M12 15L16 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17V19A2 2 0 006 21H18A2 2 0 0020 19V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        Excel
                    </button>
                    <button type="button" class="btn btn-primary" th:if="${#lists.contains(permissions,'USER_ADD')}">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        Add User
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-toolbar">
                    <span th:text="'Showing 1-' + ${#lists.size(users)} + ' of ' + ${#lists.size(users)}">Showing 1-3 of 3</span>
                    <span class="hint">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 8V13M12 16H12.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                        Double-click a user to open it
                    </span>
                </div>

                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Employee ID</th>
                            <th>Username</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th th:if="${#lists.contains(permissions,'USER_EDIT') or #lists.contains(permissions,'USER_DELETE')}">
                                Actions
                            </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td class="code" th:text="${user.employeeId}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.firstName + ' ' + (user.lastName != null ? user.lastName : '')}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.department}"></td>
                            <td>
                                <span class="badge" th:classappend="${user.status == 'ACTIVE'} ? ' active' : ' inactive'" th:text="${user.status}">ACTIVE</span>
                            </td>
                            <td>
                                <button type="button" class="btn" style="padding:6px 12px;" th:if="${#lists.contains(permissions,'USER_EDIT')}">Edit</button>
                                <button type="button" class="btn" style="padding:6px 12px;" th:if="${#lists.contains(permissions,'USER_DELETE')}">Delete</button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" class="empty-state">No users found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="card-footer">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        <input type="text" placeholder="Search user name, email...">
                    </div>
                    <div class="pagination">
                        <button type="button" class="btn">Previous</button>
                        <span>Page 1 of 1</span>
                        <button type="button" class="btn">Next</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

</div>

<script th:src="@{/js/sidebar-menu.js}"></script>
</body>
</html>

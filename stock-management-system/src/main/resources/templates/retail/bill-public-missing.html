<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bill not found</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f6f6f6; font-family: Arial, Helvetica, sans-serif; color: #222; }
        .box { max-width: 340px; margin: 16px; padding: 28px 22px; background: #fff; border-radius: 14px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { margin: 0; color: #555; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Bill not found</h1>
        <p>This bill link is not correct. Please ask the shop to send it again.</p>
    </div>
</body>
</html>

# Production profile. Activate with:  SPRING_PROFILES_ACTIVE=prod
# No secrets in this file: everything comes from environment variables.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Never let Hibernate change the schema in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.seed.enabled=false

# Templates / static files cached for speed
spring.thymeleaf.cache=true
spring.web.resources.cache.period=3600

# Session cookie only over HTTPS (site must be served via HTTPS)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Behind nginx / load balancer: set FORWARD_HEADERS_STRATEGY=native and APP_TRUST_PROXY=true
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Quiet logs: no DEBUG, so request data does not leak into log files
logging.level.root=INFO
logging.level.com.stockmanagement=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN